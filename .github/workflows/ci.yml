name: CI

on:
  push:
    branches:
      - main
      - agent/initial-v0.1-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the complete quality gate
        run: npm run check

      - name: Publish bundle-budget report
        run: |
          echo '### Bundle budgets' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat dist/bundle-size.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production bundles and size report
        uses: actions/upload-artifact@v6
        with:
          name: chartix-dist-${{ github.sha }}
          path: |
            dist
          retention-days: 14
