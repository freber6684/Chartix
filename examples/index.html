<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chartix alpha preview</title>
    <style>
      :root {
        color: #172033;
        background: #f4f6fa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        padding: 48px 24px;
      }
      main {
        width: min(1180px, 100%);
        margin: 0 auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 24px;
        margin-bottom: 24px;
      }
      h1,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(32px, 5vw, 52px);
        letter-spacing: -0.04em;
      }
      header p {
        max-width: 520px;
        color: #64748b;
        line-height: 1.55;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr));
        gap: 20px;
      }
      .card {
        min-width: 0;
        border: 1px solid #e3e8ef;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 14px 40px rgb(31 41 55 / 8%);
      }
      .dark {
        border-color: #263246;
        background: #111827;
      }
      [data-chartix] {
        position: relative;
        width: 100%;
      }
      .hint {
        padding: 12px 20px;
        border-top: 1px solid #e3e8ef;
        color: #64748b;
        font-size: 13px;
      }
      @media (max-width: 700px) {
        body {
          padding: 28px 14px;
        }
        header {
          display: block;
        }
        header p {
          margin-top: 12px;
        }
      }
    </style>
    <script src="../dist/chartix.min.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Chartix alpha</h1>
        <p>
          Five chart types, nine themes, accessible output, responsive Canvas rendering, and
          configurable colors, fonts, labels, and sizing.
        </p>
      </header>
      <section class="grid" aria-label="Chart examples">
        <article class="card">
          <div
            data-chartix
            data-type="bar"
            data-labels="Jan,Feb,Mar,Apr,May,Jun"
            data-values="120,190,164,245,278,338"
            data-label="Revenue"
            data-title="Revenue momentum"
            data-theme="light"
            data-height="410"
          ></div>
        </article>
        <article class="card dark">
          <div
            data-chartix
            data-height="410"
            data-config='{"type":"line","theme":"dark","data":{"labels":["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],"datasets":[{"label":"Active users","values":[180,248,221,310,365,342,430]},{"label":"New users","values":[96,122,108,158,174,168,210]}]},"options":{"title":"Weekly audience","fill":true,"animation":{"duration":480,"easing":"easeOutCubic"},"showDataTable":true,"xLabels":{"rotation":-18,"color":"#c4b5fd"}}}'
          ></div>
        </article>
        <article class="card">
          <div
            data-chartix
            data-config='{"type":"pie","theme":"sunset","data":{"labels":["Product","Services","Support","Other"],"datasets":[{"label":"Revenue mix","values":[48,27,17,8]}]},"options":{"title":"Revenue mix","height":410,"dataLabels":{"show":true,"position":"outside","fontSize":11,"backgroundColor":"#ffffffcc"},"startAngle":-90}}'
          ></div>
        </article>
        <article class="card">
          <div
            data-chartix
            data-config='{"type":"doughnut","theme":"ocean","data":{"labels":["Organic","Search","Social","Email"],"datasets":[{"label":"Traffic","values":[42,31,18,9]}]},"options":{"title":"Traffic sources","height":410,"innerRadius":0.62,"dataLabels":{"show":true,"position":"inside","fontSize":11},"colors":["#023e8a","#0077b6","#00b4d8","#90e0ef"]}}'
          ></div>
        </article>
        <article class="card">
          <div
            data-chartix
            data-config='{"type":"scatter","theme":"forest","data":{"labels":["12","18","27","35","43","56"],"datasets":[{"label":"Campaign A","values":[24,38,32,57,63,82]},{"label":"Campaign B","values":[18,29,46,48,71,76]}]},"options":{"title":"Spend vs conversions","height":410,"resizable":true,"dataLabels":{"show":true,"position":"outside","fontSize":10,"color":"#1e392a"},"xLabels":{"rotation":-25},"typography":{"fontFamily":"Georgia, serif","titleSize":18}}}'
          ></div>
          <p class="hint">Drag the lower-right edge to resize this chart.</p>
        </article>
      </section>
    </main>
  </body>
</html>
